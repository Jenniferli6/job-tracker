name: Job Alert Poller

on:
  schedule:
    # Fixed at UTC-4 (EDT), not DST-aware:
    #   During EDT: 00:00 / 12:00 ET (midnight / noon), 04:00 / 16:00 UTC
    #   During EST: 23:00 (previous day) / 11:00 ET, 04:00 / 16:00 UTC
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state.json

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run poller
        run: python poller.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Run role scanner
        run: python role_scanner.py

      - name: Commit updated state
        run: |
          git config user.name "job-poller-bot"
          git config user.email "actions@github.com"
          git add state.json jobs_log.json docs/jobs_log.json docs/companies.json roles_snapshot.json docs/roles_snapshot.json
          git diff --staged --quiet || git commit -m "Update job state [skip ci]"
          git push
