<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Tracker — Target Company Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F14;
    --surface: #121820;
    --surface-2: #1A222C;
    --border: #232D39;
    --text: #E4E9EF;
    --text-dim: #8291A0;
    --text-faint: #4C5A68;
    --accent: #6EE7B7;
    --accent-dim: #3A5B4D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

  header { margin-bottom: 32px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(110,231,183,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(110,231,183,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(110,231,183,0); }
    100% { box-shadow: 0 0 0 0 rgba(110,231,183,0); }
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: 0;
  }
  .sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 28px 0;
  }
  .tabs {
    display: inline-flex;
    padding: 3px;
    margin: 0 0 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .tab {
    border: 0;
    border-radius: 5px;
    padding: 8px 14px;
    background: transparent;
    color: var(--text-dim);
    font: 500 13px 'Inter', sans-serif;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    background: var(--surface-2);
  }
  .stat {
    background: var(--surface);
    padding: 16px 18px;
  }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .controls[hidden], [hidden] { display: none !important; }
  input[type=text], select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    outline: none;
  }
  input[type=text] { flex: 1; min-width: 200px; }
  input[type=text]:focus, select:focus { border-color: var(--accent-dim); }
  select { cursor: pointer; min-width: 140px; }

  .filter-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .filter-check:has(input:checked) {
    color: var(--text);
    border-color: var(--accent-dim);
  }
  .filter-check input {
    accent-color: var(--accent);
    cursor: pointer;
  }

  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  th {
    text-align: left;
    padding: 12px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  th:last-child { width: 130px; }
  td {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    vertical-align: top;
  }
  tr.job-row {
    cursor: pointer;
    transition: background 0.12s ease;
  }
  tr.job-row:hover { background: var(--surface-2); }
  .col-company {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    white-space: nowrap;
  }
  .col-role {
    color: var(--text);
    font-weight: 500;
  }
  .col-role.custom-alert {
    color: var(--text-dim);
    font-weight: 400;
    font-style: italic;
  }
  .col-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .col-location {
    color: var(--text-dim);
    font-size: 13px;
    max-width: 240px;
  }
  .col-category { color: var(--text-dim); }
  .col-ats {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .site-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .site-link:hover { text-decoration: underline; }
  .site-domain {
    display: block;
    max-width: 280px;
    margin-top: 3px;
    overflow: hidden;
    color: var(--text-faint);
    font: 11px 'IBM Plex Mono', monospace;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty-icon {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-faint);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .empty-title { font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .scan-note {
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  @media (max-width: 600px) {
    .stats { grid-template-columns: 1fr; }
    .table-wrap { overflow-x: auto; }
    th, td { padding: 10px 12px; }
    .col-company { white-space: normal; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow"><span class="pulse"></span>MONITORING · DAILY</div>
      <h1>Job Tracker</h1>
      <p class="sub">New postings across your target company list, newest first.</p>
    </header>

    <nav class="tabs" aria-label="Dashboard views">
      <button class="tab active" type="button" data-view="jobs">Target Company Jobs</button>
      <button class="tab" type="button" data-view="companies">Target Companies</button>
      <button class="tab" type="button" data-view="roles">Interested Roles</button>
    </nav>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">postings logged</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-today">—</div>
        <div class="stat-label">found on latest run</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-companies">—</div>
        <div class="stat-label">companies represented</div>
      </div>
    </div>

    <div class="controls" id="jobControls">
      <input type="text" id="search" placeholder="Search title or company...">
      <select id="companyFilter"><option value="">All companies</option></select>
      <select id="dateFilter"><option value="">All dates</option></select>
      <select id="locationFilter">
        <option value="">All locations</option>
        <option value="california" selected>California</option>
        <option value="us">United States</option>
      </select>
      <label class="filter-check">
        <input type="checkbox" id="hideCustom" checked>
        Hide page-change alerts
      </label>
    </div>

    <div class="controls" id="companyControls" hidden>
      <input type="text" id="companySearch" placeholder="Search company, category, or website...">
      <select id="categoryFilter"><option value="">All categories</option></select>
      <select id="atsFilter"><option value="">All tracking types</option></select>
    </div>

    <div class="controls" id="rolesControls" hidden>
      <input type="text" id="rolesSearch" placeholder="Search title or company...">
      <select id="roleLabelFilter"><option value="">All roles</option></select>
      <select id="rolesLocationFilter">
        <option value="">All locations</option>
        <option value="california">California</option>
        <option value="us">United States</option>
      </select>
    </div>

    <div id="feed"></div>
    <div id="companyList" hidden></div>
    <div id="rolesFeed" hidden></div>
  </div>

  <script>
    let allJobs = [];
    let allCompanies = [];
    let allRoles = [];
    let rolesScannedAt = null;
    let activeView = 'jobs';

    function isCustomAlert(job) {
      return job.title.includes('Careers page content changed');
    }

    const US_STATES = [
      'alabama', 'alaska', 'arizona', 'arkansas', 'california', 'colorado',
      'connecticut', 'delaware', 'florida', 'georgia', 'hawaii', 'idaho',
      'illinois', 'indiana', 'iowa', 'kansas', 'kentucky', 'louisiana',
      'maine', 'maryland', 'massachusetts', 'michigan', 'minnesota',
      'mississippi', 'missouri', 'montana', 'nebraska', 'nevada',
      'new hampshire', 'new jersey', 'new mexico', 'new york',
      'north carolina', 'north dakota', 'ohio', 'oklahoma', 'oregon',
      'pennsylvania', 'rhode island', 'south carolina', 'south dakota',
      'tennessee', 'texas', 'utah', 'vermont', 'virginia', 'washington',
      'west virginia', 'wisconsin', 'wyoming', 'district of columbia',
    ];

    const CA_MARKERS = [
      'california', 'san francisco', 'los angeles', 'palo alto',
      'mountain view', 'sunnyvale', 'cupertino', 'menlo park', 'san jose',
      'oakland', 'santa clara', 'irvine', 'san diego', 'pasadena', 'fremont',
      'redwood city', 'san mateo', 'berkeley', 'sacramento', 'bay area',
      'silicon valley', 'sf bay', 'california - sf',
    ];

    const US_CITIES = [
      'san francisco', 'new york', 'seattle', 'austin', 'boston', 'chicago',
      'denver', 'los angeles', 'palo alto', 'mountain view', 'sunnyvale',
      'cupertino', 'menlo park', 'redmond', 'bellevue', 'portland', 'atlanta',
      'miami', 'dallas', 'houston', 'phoenix', 'san diego', 'san jose',
      'oakland', 'santa clara', 'fremont', 'irvine', 'pasadena', 'boulder',
      'nashville', 'detroit', 'minneapolis', 'philadelphia', 'pittsburgh',
      'raleigh', 'salt lake city', 'san antonio', 'tampa', 'bay area',
      'silicon valley', 'nyc',
    ];

    function locationText(job) {
      return (job.location || '').trim();
    }

    function isCaliforniaLocation(loc) {
      const l = loc.toLowerCase();
      if (CA_MARKERS.some(m => l.includes(m))) return true;
      if (/\bca\b/.test(l) || l.includes(', ca') || l.includes('; ca') ||
          l.includes('/ ca') || l.includes('| ca')) return true;
      return false;
    }

    function isUnitedStatesLocation(loc) {
      const l = loc.toLowerCase();
      if (/\b(united states|united states of america|usa|u\.s\.)\b/.test(l)) return true;
      if (/\b(us remote|us-remote|remote.*\b(us|usa)\b|\b(us|usa)\b.*remote)\b/.test(l)) return true;
      if (US_STATES.some(s => l.includes(s))) return true;
      if (US_CITIES.some(c => l.includes(c))) return true;
      if (/\b[a-z .]+,\s*[a-z]{2}(\s|;|,|\)|\/|\||$|-)/.test(l)) return true;
      return isCaliforniaLocation(loc);
    }

    function matchesLocation(job, filter) {
      if (!filter) return true;
      const loc = locationText(job);
      if (!loc) return false;
      if (filter === 'california') return isCaliforniaLocation(loc);
      if (filter === 'us') return isUnitedStatesLocation(loc);
      return true;
    }

    async function loadData() {
      const cacheBust = '?_=' + Date.now();
      const [jobsResult, companiesResult, rolesResult] = await Promise.allSettled([
        fetch('jobs_log.json' + cacheBust).then(res => {
          if (!res.ok) throw new Error('Could not load jobs');
          return res.json();
        }),
        fetch('companies.json' + cacheBust).then(res => {
          if (!res.ok) throw new Error('Could not load companies');
          return res.json();
        }),
        fetch('roles_snapshot.json' + cacheBust).then(res => {
          if (!res.ok) throw new Error('Could not load roles');
          return res.json();
        })
      ]);
      allJobs = jobsResult.status === 'fulfilled' ? jobsResult.value : [];
      allCompanies = companiesResult.status === 'fulfilled' ? companiesResult.value : [];
      allRoles = rolesResult.status === 'fulfilled' ? (rolesResult.value.roles || []) : [];
      rolesScannedAt = rolesResult.status === 'fulfilled' ? rolesResult.value.scanned_at : null;
      populateCompanyFilter();
      populateDateFilter();
      populateCompanyListFilters();
      populateRoleFilters();
      render();
    }

    function populateCompanyFilter() {
      const sel = document.getElementById('companyFilter');
      const companies = [...new Set(allJobs.map(j => j.company))].sort();
      companies.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    }

    function populateDateFilter() {
      const sel = document.getElementById('dateFilter');
      const dates = [...new Set(allJobs.map(j => j.date_found))].sort().reverse();
      dates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        sel.appendChild(opt);
      });
    }

    function populateCompanyListFilters() {
      addOptions('categoryFilter', [...new Set(allCompanies.map(c => c.category).filter(Boolean))].sort());
      addOptions('atsFilter', [...new Set(allCompanies.map(c => c.ats).filter(Boolean))].sort());
    }

    function populateRoleFilters() {
      addOptions('roleLabelFilter', [...new Set(allRoles.map(r => r.matched_role).filter(Boolean))].sort());
    }

    function addOptions(id, values) {
      const sel = document.getElementById(id);
      values.forEach(value => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = value;
        sel.appendChild(opt);
      });
    }

    function render() {
      if (activeView === 'companies') {
        renderCompanies();
        return;
      }
      if (activeView === 'roles') {
        renderRoles();
        return;
      }
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const companyFilter = document.getElementById('companyFilter').value;
      const dateFilter = document.getElementById('dateFilter').value;
      const locationFilter = document.getElementById('locationFilter').value;
      const hideCustom = document.getElementById('hideCustom').checked;

      let filtered = allJobs.filter(j => {
        const haystack = [j.title, j.company, locationText(j)].join(' ').toLowerCase();
        const matchesSearch = !searchTerm || haystack.includes(searchTerm);
        const matchesCompany = !companyFilter || j.company === companyFilter;
        const matchesDate = !dateFilter || j.date_found === dateFilter;
        const matchesLoc = matchesLocation(j, locationFilter);
        const matchesCustom = !hideCustom || !isCustomAlert(j);
        return matchesSearch && matchesCompany && matchesDate && matchesLoc && matchesCustom;
      });

      const latestDate = allJobs[0]?.date_found;
      setStats(
        filtered.length,
        filtered.filter(j => j.date_found === latestDate).length || 0,
        new Set(filtered.map(j => j.company)).size,
        'matching postings', 'found on latest run', 'companies represented'
      );

      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="empty">
            <div class="empty-icon">// no results</div>
            <div class="empty-title">${allJobs.length === 0 ? 'No postings logged yet' : 'Nothing matches your filters'}</div>
            <div>${allJobs.length === 0 ? "The dashboard fills in after the poller's next run finds something new." : 'Try a different search or company.'}</div>
          </div>`;
        return;
      }

      const table = document.createElement('div');
      table.className = 'table-wrap';
      table.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Role</th>
              <th>Location</th>
              <th>Posting Date</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>`;
      const tbody = table.querySelector('tbody');

      filtered.forEach(j => {
        const isCustom = isCustomAlert(j);
        const tr = document.createElement('tr');
        tr.className = 'job-row';
        const loc = locationText(j);
        tr.innerHTML = `
          <td class="col-company">${escapeHtml(j.company)}</td>
          <td class="col-role${isCustom ? ' custom-alert' : ''}">${escapeHtml(j.title)}</td>
          <td class="col-location">${loc ? escapeHtml(loc) : '<span class="col-date">—</span>'}</td>
          <td class="col-date">${escapeHtml(j.date_found)}</td>`;
        if (j.url) {
          tr.addEventListener('click', () => window.open(j.url, '_blank', 'noopener'));
        }
        tbody.appendChild(tr);
      });

      feed.appendChild(table);
    }

    function renderCompanies() {
      const searchTerm = document.getElementById('companySearch').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const ats = document.getElementById('atsFilter').value;
      const filtered = allCompanies.filter(company => {
        const haystack = [company.name, company.category, company.careers_url, company.ats]
          .filter(Boolean).join(' ').toLowerCase();
        return (!searchTerm || haystack.includes(searchTerm)) &&
          (!category || company.category === category) &&
          (!ats || company.ats === ats);
      });

      setStats(
        allCompanies.length,
        new Set(allCompanies.map(c => c.category).filter(Boolean)).size,
        new Set(allCompanies.map(c => c.ats).filter(Boolean)).size,
        'target companies', 'categories', 'tracking types'
      );

      const container = document.getElementById('companyList');
      container.innerHTML = '';
      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty"><div class="empty-icon">// no results</div><div class="empty-title">${allCompanies.length ? 'Nothing matches your filters' : 'Company list unavailable'}</div><div>${allCompanies.length ? 'Try a different search or filter.' : 'The published companies.json file could not be loaded.'}</div></div>`;
        return;
      }

      const table = document.createElement('div');
      table.className = 'table-wrap';
      table.innerHTML = `<table><thead><tr><th>Company</th><th>Category</th><th>Careers website</th><th>Tracking</th></tr></thead><tbody></tbody></table>`;
      const tbody = table.querySelector('tbody');
      filtered.forEach(company => {
        const tr = document.createElement('tr');
        const url = safeUrl(company.careers_url);
        const domain = url ? new URL(url).hostname.replace(/^www\./, '') : '';
        tr.innerHTML = `
          <td class="col-company">${escapeHtml(company.name)}</td>
          <td class="col-category">${escapeHtml(company.category || 'Uncategorized')}</td>
          <td>${url ? `<a class="site-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">Open careers site</a><span class="site-domain">${escapeHtml(domain)}</span>` : '<span class="col-date">Not available</span>'}</td>
          <td class="col-ats">${escapeHtml(company.ats)}</td>`;
        tbody.appendChild(tr);
      });
      container.appendChild(table);
    }

    function renderRoles() {
      const searchTerm = document.getElementById('rolesSearch').value.toLowerCase();
      const labelFilter = document.getElementById('roleLabelFilter').value;
      const locationFilter = document.getElementById('rolesLocationFilter').value;

      const filtered = allRoles.filter(r => {
        const haystack = [r.title, r.company, locationText(r)].join(' ').toLowerCase();
        const matchesSearch = !searchTerm || haystack.includes(searchTerm);
        const matchesLabel = !labelFilter || r.matched_role === labelFilter;
        const matchesLoc = matchesLocation(r, locationFilter);
        return matchesSearch && matchesLabel && matchesLoc;
      });

      setStats(
        filtered.length,
        new Set(filtered.map(r => r.company)).size,
        new Set(filtered.map(r => r.matched_role)).size,
        'open roles found', 'companies represented', 'role types'
      );

      const container = document.getElementById('rolesFeed');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">// no results</div>
            <div class="empty-title">${allRoles.length === 0 ? 'No role scan data yet' : 'Nothing matches your filters'}</div>
            <div>${allRoles.length === 0 ? 'The dashboard fills in after the role scanner\'s next run.' : 'Try a different search or filter.'}</div>
          </div>`;
        return;
      }

      const table = document.createElement('div');
      table.className = 'table-wrap';
      table.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Role</th>
              <th>Title</th>
              <th>Location</th>
              <th>Platform</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>`;
      const tbody = table.querySelector('tbody');

      filtered.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = 'job-row';
        const loc = locationText(r);
        tr.innerHTML = `
          <td class="col-company">${escapeHtml(r.company)}</td>
          <td class="col-category">${escapeHtml(r.matched_role)}</td>
          <td class="col-role">${escapeHtml(r.title)}</td>
          <td class="col-location">${loc ? escapeHtml(loc) : '<span class="col-date">—</span>'}</td>
          <td class="col-ats">${escapeHtml(r.platform)}</td>`;
        if (r.url) {
          tr.addEventListener('click', () => window.open(r.url, '_blank', 'noopener'));
        }
        tbody.appendChild(tr);
      });

      container.appendChild(table);

      if (rolesScannedAt) {
        const note = document.createElement('div');
        note.className = 'scan-note';
        note.textContent = `Last scanned: ${new Date(rolesScannedAt).toLocaleString()}`;
        container.appendChild(note);
      }
    }

    function setStats(first, second, third, firstLabel, secondLabel, thirdLabel) {
      document.getElementById('stat-total').textContent = first;
      document.getElementById('stat-today').textContent = second;
      document.getElementById('stat-companies').textContent = third;
      const labels = document.querySelectorAll('.stat-label');
      [firstLabel, secondLabel, thirdLabel].forEach((label, index) => labels[index].textContent = label);
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch (_) {
        return '';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('companyFilter').addEventListener('change', render);
    document.getElementById('dateFilter').addEventListener('change', render);
    document.getElementById('locationFilter').addEventListener('change', render);
    document.getElementById('hideCustom').addEventListener('change', render);
    document.getElementById('companySearch').addEventListener('input', render);
    document.getElementById('categoryFilter').addEventListener('change', render);
    document.getElementById('atsFilter').addEventListener('change', render);
    document.getElementById('rolesSearch').addEventListener('input', render);
    document.getElementById('roleLabelFilter').addEventListener('change', render);
    document.getElementById('rolesLocationFilter').addEventListener('change', render);
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeView = tab.dataset.view;
        document.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item === tab));
        document.getElementById('jobControls').hidden = activeView !== 'jobs';
        document.getElementById('companyControls').hidden = activeView !== 'companies';
        document.getElementById('rolesControls').hidden = activeView !== 'roles';
        document.getElementById('feed').hidden = activeView !== 'jobs';
        document.getElementById('companyList').hidden = activeView !== 'companies';
        document.getElementById('rolesFeed').hidden = activeView !== 'roles';
        render();
      });
    });

    loadData();
  </script>

  <footer>tracking companies via Greenhouse / Lever / Ashby / custom career pages · updates daily via GitHub Actions</footer>
</body>
</html>
